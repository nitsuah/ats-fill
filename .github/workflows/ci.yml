name: CI

on:
  push:
    branches: ['**'] # every branch — feature branches (pmo-q3*, dev/*, fixes) all run CI
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight run for the same ref so force-pushes don't waste minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Fast gate: lint + unit tests (under 2 min, blocks PRs quickly) ──────────
  fast:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test -t ats-fill:test .

      - name: Lint
        run: docker run --rm ats-fill:test npm run lint

      - name: Unit tests
        run: docker run --rm ats-fill:test npm test

  # ── Coverage: runs after fast gate, uploads report ──────────────────────────
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: fast

    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test -t ats-fill:test .

      - name: Generate coverage
        run: |
          docker run --rm             -v ${{ github.workspace }}/coverage:/app/coverage             ats-fill:test npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ── E2E: Playwright in Docker, runs after fast gate ─────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: fast
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Build e2e image
        run: docker build --target e2e -t ats-fill:e2e .

      - name: Run Playwright
        run: |
          docker run --rm             -v ${{ github.workspace }}/playwright-report:/app/playwright-report             -v ${{ github.workspace }}/test-results:/app/test-results             ats-fill:e2e sh -c "ls -la /app/dist && xvfb-run --server-args='-screen 0 1280x720x24' npm run test:e2e"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7

  # ── Screenshot gallery: must pass before a UI change can merge ──────────────
  screenshot-gallery:
    name: UI Screenshot Gallery
    runs-on: ubuntu-latest
    needs: [fast, coverage, e2e]
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Build e2e image
        run: docker build --target e2e -t ats-fill:e2e .

      - name: Capture product screenshots
        run: |
          rm -rf screenshots
          mkdir -p screenshots
          docker run --rm             -v ${{ github.workspace }}/screenshots:/app/screenshots             ats-fill:e2e             sh -c "xvfb-run --server-args='-screen 0 1280x720x24' npx playwright test --config config/playwright.config.mjs tests/e2e/screenshots.spec.mjs"

      - name: Validate screenshot gallery
        run: node scripts/validate-screenshot-gallery.mjs

      - name: Upload screenshot gallery
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ats-fill-ui-gallery-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 14


      - name: Determine whether gallery publication is needed
        id: publish_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" != "push" ] || [ "$REF" != "refs/heads/main" ]; then
            echo "Gallery publication only runs for main push events."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$COMMIT_MESSAGE" = "docs: refresh UI screenshots" ]; then
            echo "Screenshot gallery commit detected; skipping publication to prevent a loop."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Verify main still points to captured commit
        if: ${{ steps.publish_guard.outputs.publish == 'true' }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"

          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main moved from $GITHUB_SHA to $current_main; skipping this gallery publication."
            exit 0
          fi

      - name: Refresh README UI metadata
        if: ${{ steps.publish_guard.outputs.publish == 'true' }}
        run: node scripts/update-screenshot-metadata.mjs

      - name: Publish gallery branch and PR
        if: ${{ steps.publish_guard.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- screenshots README.md; then
            echo "UI gallery is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expected_sha="$(git rev-parse HEAD)"
          branch="automation/ui-screenshot-gallery-${expected_sha:0:12}"

          git switch -c "$branch"
          git add screenshots/ README.md
          git commit -m "docs: refresh UI screenshots"
          git push --set-upstream origin "$branch"

          gh pr create             --repo "$GH_REPO"             --base main             --head "$branch"             --title "docs: refresh UI screenshots"             --body "Automated UI screenshot gallery refresh generated from main commit '$expected_sha'.

This PR is published by the existing CI workflow after the blocking CI gates and screenshot validation pass. The gallery was captured with the deterministic Playwright fixture."

          echo "Screenshot gallery PR created for $branch."

  # ── Security audit: non-blocking, surfaces known vulns as a warning ──────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: fast

    steps:
      - uses: actions/checkout@v7

      - name: Build test image
        run: docker build --target test -t ats-fill:test .

      - name: npm audit (moderate+)
        run: docker run --rm ats-fill:test npm audit --audit-level moderate
        continue-on-error: true
