name: Journeys

# Nightly "AI user": the happy paths in tests/journeys, run in Docker with
# visual baselines. Replaces the artifact-only playwright-nightly.yml (the full
# e2e suite still runs on every PR and push in ci.yml). Failures become
# deduplicated `bot:journey` issues (no AI) via the shared harness in
# nitsuah/.github (journeys/STANDARD.md); fix PRs are verified by the following
# nights, and issues auto-close after 3 green runs. BUGS.md and metrics live on
# the bot/journeys branch.

on:
  schedule:
    - cron: '0 6 * * *' # 06:00 UTC nightly (the old nightly's slot)
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'tests/journeys/**'
      - 'config/playwright.journeys.config.mjs'
      - 'tests/e2e/helpers/**'
      - '.github/workflows/journeys.yml'

permissions: {}

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run repo code (npm ci, the journeys) and only print a summary,
  # so they get a read-only token.
  journeys-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    uses: nitsuah/.github/.github/workflows/journeys.yml@b0a9f894a450790450aaecb2b1fb1b2ea524f64d # main 2026-10-15
    with:
      # Keep in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: b0a9f894a450790450aaecb2b1fb1b2ea524f64d # same commit as the workflow ref above; bump both together
      repro: |
        docker run --rm -v "$PWD:/w" -w /w -e CI=true mcr.microsoft.com/playwright:v1.64.0-jammy \
          sh -c "npm ci && npm run test:journeys"

  # Nightly and manual runs file and close bot:journey issues and update the
  # bot/journeys branch (BUGS.md, metrics).
  journeys:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # bot/journeys branch only
      issues: write
    uses: nitsuah/.github/.github/workflows/journeys.yml@b0a9f894a450790450aaecb2b1fb1b2ea524f64d # main 2026-10-15
    with:
      # Keep in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.0-jammy
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: b0a9f894a450790450aaecb2b1fb1b2ea524f64d # same commit as the workflow ref above; bump both together
      repro: |
        docker run --rm -v "$PWD:/w" -w /w -e CI=true mcr.microsoft.com/playwright:v1.64.0-jammy \
          sh -c "npm ci && npm run test:journeys"
