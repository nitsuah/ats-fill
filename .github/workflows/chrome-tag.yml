name: Create Chrome Web Store Release Tag

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Tag manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read manifest version
        id: version
        run: |
          VERSION="$(node -p 'require("./manifest.json").version')"
          node scripts/validate-release-version.mjs "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not already exist
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists."
            exit 1
          fi

      - name: Create and push release tag
        env:
          TAG: v${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

          echo "Waiting for GitHub to expose $TAG on the remote..."
          for attempt in {1..10}; do
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Confirmed remote tag $TAG."
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::Remote tag $TAG was not visible after 10 attempts."
              exit 1
            fi
            sleep 3
          done

          gh workflow run chrome-release.yml --ref "$TAG" --field "tag=$TAG"
          echo "Created, verified, and dispatched release for $TAG from main."
