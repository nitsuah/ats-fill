name: Create Chrome Web Store Release Tag

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  tag:
    name: Tag manifest version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Read manifest version
        id: version
        run: |
          VERSION="$(node -p 'require("./manifest.json").version')"
          node scripts/validate-release-version.mjs "v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        id: tag
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG already exists; no new tag will be created."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release tag $TAG does not exist; it will be created."
          fi

      - name: Create and push release tag
        if: steps.tag.outputs.exists != 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "Created and pushed release tag $TAG."

      - name: Check for existing release workflow run
        id: release_run
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          RUN_ID="$(gh run list             --workflow chrome-release.yml             --branch "$TAG"             --limit 1             --json databaseId             --jq '.[0].databaseId // empty')"

          if [ -n "$RUN_ID" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store release workflow already has run $RUN_ID for $TAG."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No Chrome Web Store release workflow run exists yet for $TAG."
          fi

      - name: Dispatch Chrome Web Store release
        if: steps.release_run.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh workflow run chrome-release.yml             --ref "$TAG"             --field "tag=$TAG"

          echo "Dispatched Chrome Web Store release for $TAG."
