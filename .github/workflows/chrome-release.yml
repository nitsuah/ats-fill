name: Chrome Web Store Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release"
        required: true
        type: string

concurrency:
  group: chrome-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout default branch history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify release tag
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          EVENT_REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$EVENT_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
              echo "::error::Run this workflow from the default branch."
              exit 1
            fi
            TAG="$INPUT_TAG"
          else
            case "$EVENT_REF" in
              refs/tags/v*) ;;
              *) echo "::error::Release runs require a refs/tags/v* ref."; exit 1 ;;
            esac
            TAG="$EVENT_REF_NAME"
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like vX.Y.Z."
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$TAG:refs/tags/$TAG"
          SHA="$(git rev-parse "refs/tags/$TAG^{commit}")"
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tag is not part of the default branch history."
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "version=${TAG#v}"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

  package:
    name: Validate, test, package
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Validate release tag
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: node scripts/validate-release-version.mjs "$TAG"

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      - name: Build and package
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: node scripts/package-extension.mjs "ats-fill-${TAG}.zip"

      - name: Verify package contents
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          PACKAGE: ats-fill-${{ needs.resolve.outputs.tag }}.zip
        run: |
          unzip -t "$PACKAGE"
          unzip -p "$PACKAGE" manifest.json > /tmp/manifest.json
          node -e 'const fs=require("fs"); const m=JSON.parse(fs.readFileSync("/tmp/manifest.json")); if(m.version!==process.env.RELEASE_VERSION){throw new Error("Packaged manifest version mismatch")}'

      - name: SHA-256
        env:
          PACKAGE: ats-fill-${{ needs.resolve.outputs.tag }}.zip
        run: sha256sum "$PACKAGE" > SHA256SUMS.txt

      - name: Upload verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            ats-fill-${{ needs.resolve.outputs.tag }}.zip
            SHA256SUMS.txt
          retention-days: 7

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          PACKAGE: ats-fill-${{ needs.resolve.outputs.tag }}.zip
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating its verified assets."
            gh release upload "$TAG" "$PACKAGE" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$PACKAGE" SHA256SUMS.txt --title "$TAG" --generate-notes
          fi

  # The Chrome Web Store API (v2) only uploads and publishes the package; it has
  # no endpoint for listing screenshots, promo tiles or the store icon. Build the
  # exact listing set from the release tag and attach it to the GitHub Release so
  # the Developer Dashboard upload is a one-step drag-and-drop for this version.
  store-assets:
    name: Store listing assets
    needs: [resolve, package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Tags cut before the listing-asset tooling landed (#112) have no spec to run,
      # which made this job fail with 'No tests found'. Skip those with a notice.
      - name: Check the tag has the listing-asset tooling
        id: tooling
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if [ -f tests/e2e/store-assets.spec.mjs ] && [ -f scripts/validate-store-assets.mjs ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Store listing assets skipped::$TAG predates the listing-asset tooling (tests/e2e/store-assets.spec.mjs); tag a newer release to generate them."
          fi

      - name: Build e2e image
        if: steps.tooling.outputs.available == 'true'
        run: docker build --target e2e -t ats-fill:e2e .

      - name: Generate store screenshots, promo tiles and icon
        if: steps.tooling.outputs.available == 'true'
        run: |
          rm -rf store-assets
          mkdir -p store-assets
          docker run --rm \
            -v "$GITHUB_WORKSPACE/store-assets:/app/store-assets" \
            ats-fill:e2e \
            sh -c "xvfb-run --server-args='-screen 0 1400x900x24' npx playwright test --config config/playwright.config.mjs tests/e2e/store-assets.spec.mjs"

      - name: Validate against Chrome Web Store image specs
        if: steps.tooling.outputs.available == 'true'
        run: node scripts/validate-store-assets.mjs store-assets

      - name: Attach listing bundle to the GitHub Release
        if: steps.tooling.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          BUNDLE="ats-fill-${TAG}-store-assets.zip"
          cp docs/CHROME_WEB_STORE_ASSETS.md store-assets/README.md
          (cd store-assets && zip -q -r "../$BUNDLE" .)
          gh release upload "$TAG" "$BUNDLE" --clobber
          {
            echo "### Chrome Web Store listing assets for $TAG"
            echo
            echo "The Store API cannot update listing images, so upload these by hand:"
            echo "1. Download \`$BUNDLE\` from the [$TAG release](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG})."
            echo "2. Open the [Developer Dashboard](https://chrome.google.com/webstore/devconsole) → ats-fill → **Store listing**."
            echo "3. Replace the store icon, the five screenshots (in file order) and both promo tiles, then save."
            echo
            echo "| File | Dashboard slot |"
            echo "| --- | --- |"
            echo "| store-icon-128.png | Store icon |"
            echo "| screenshot-01 … 05 (*.jpg) | Screenshots 1–5 |"
            echo "| small-promo.jpg | Small promo tile |"
            echo "| marquee-promo.jpg | Marquee promo tile |"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to Chrome Web Store
    needs: [resolve, package]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package

      - name: Verify downloaded checksum
        env:
          PACKAGE: ats-fill-${{ needs.resolve.outputs.tag }}.zip
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          PACKAGE: ats-fill-${{ needs.resolve.outputs.tag }}.zip
        run: node scripts/publish-chrome-web-store.mjs "$PACKAGE"
