name: Chrome Web Store Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing vX.Y.Z tag to release"
        required: true
        type: string

concurrency:
  group: chrome-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    name: Validate, test, package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        run: node scripts/validate-release-version.mjs "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"

      - name: Validate manifest
        run: node scripts/validate-manifest.mjs

      - name: Build and package
        run: node scripts/package-extension.mjs "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip"

      - name: Verify package contents
        run: |
          unzip -t "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip"
          unzip -p "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip" manifest.json > /tmp/manifest.json
          node -e 'const m=require("/tmp/manifest.json"); if (m.version !== process.env.RELEASE_VERSION) process.exit(1)'             RELEASE_VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}".replace(/^v/, "")

      - name: SHA-256
        run: sha256sum "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip" > SHA256SUMS.txt

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          gh release create "$TAG"             "auto-apply-plugin-$TAG.zip"             SHA256SUMS.txt             --title "$TAG"             --generate-notes

  publish:
    name: Publish to Chrome Web Store
    needs: package
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Checkout exact release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Rebuild release package
        run: node scripts/package-extension.mjs "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip"

      - name: Publish
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/publish-chrome-web-store.mjs "auto-apply-plugin-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}.zip"
