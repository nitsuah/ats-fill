name: Refresh UI Screenshots

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: ui-assets-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Capture and publish UI gallery
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout CI commit
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout main for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Determine whether refresh is needed
        id: refresh_guard
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "refresh=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$WORKFLOW_EVENT" != "push" ] || [ "$WORKFLOW_BRANCH" != "main" ] || [ "$WORKFLOW_CONCLUSION" != "success" ]; then
            echo "CI workflow run is not a successful main push; skipping screenshot refresh."
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$WORKFLOW_MESSAGE" = "docs: refresh UI screenshots" ]; then
            echo "Screenshot gallery commit detected; skipping refresh."
            echo "refresh=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "refresh=true" >> "$GITHUB_OUTPUT"

      - name: Verify main still points to captured commit
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' && github.event_name == 'workflow_run' }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"

          if [ "$current_main" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Main moved from ${{ github.event.workflow_run.head_sha }} to $current_main; skipping this gallery refresh."
            exit 1
          fi

      - name: Build screenshot image
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' }}
        run: docker build --target e2e -t ats-fill:e2e .

      - name: Capture product screenshots
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' }}
        run: |
          rm -rf screenshots
          mkdir -p screenshots
          docker run --rm             -v "${{ github.workspace }}/screenshots:/app/screenshots"             ats-fill:e2e             sh -c "xvfb-run --server-args='-screen 0 1280x720x24' npx playwright test --config config/playwright.config.mjs tests/e2e/screenshots.spec.mjs"

      - name: Validate screenshot gallery
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' }}
        run: node scripts/validate-screenshot-gallery.mjs

      - name: Refresh README UI metadata
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' }}
        run: node scripts/update-screenshot-metadata.mjs

      - name: Upload gallery artifact
        if: always() && steps.refresh_guard.outputs.refresh == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ats-fill-ui-gallery-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish gallery branch and PR
        if: ${{ steps.refresh_guard.outputs.refresh == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- screenshots README.md; then
            echo "UI gallery is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expected_sha="$(git rev-parse HEAD)"
          branch="automation/ui-screenshot-gallery-${expected_sha:0:12}"

          git switch -c "$branch"
          git add screenshots/ README.md
          git commit -m "docs: refresh UI screenshots"
          git push --set-upstream origin "$branch"

          gh pr create             --repo "$GH_REPO"             --base main             --head "$branch"             --title "docs: refresh UI screenshots"             --body "Automated UI screenshot gallery refresh generated from main commit '$expected_sha'.

This PR is intentionally published through the repository PR workflow rather than pushing directly to main. The gallery was captured with the deterministic Playwright fixture and passed the screenshot gallery validator before publication."

          echo "Screenshot gallery PR created for $branch."
