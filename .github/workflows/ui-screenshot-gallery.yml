name: Refresh UI Screenshots

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ui-assets-main
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Capture and publish UI gallery
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/main' &&
           github.event.head_commit.message != 'docs: refresh UI screenshots') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout pushed commit
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Checkout main for manual run
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Wait for matching CI
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 180); do
            ci_run="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow CI \
              --event push \
              --branch main \
              --commit "$GITHUB_SHA" \
              --json databaseId,status,conclusion \
              --limit 10 | jq '.[0] // empty')"

            if [ -n "$ci_run" ]; then
              status="$(jq -r '.status' <<<"$ci_run")"
              conclusion="$(jq -r '.conclusion // empty' <<<"$ci_run")"
              echo "CI status: $status${conclusion:+, conclusion: $conclusion}"

              if [ "$status" = "completed" ]; then
                if [ "$conclusion" = "success" ]; then
                  exit 0
                fi
                echo "CI did not succeed; skipping screenshot refresh."
                exit 1
              fi
            else
              echo "Waiting for matching main push CI run to appear..."
            fi

            sleep 10
          done

          echo "Timed out waiting for CI."
          exit 1

      - name: Verify main still points to captured commit
        if: ${{ github.event_name == 'push' }}
        run: |
          git fetch origin main
          current_main="$(git rev-parse origin/main)"

          if [ "$current_main" != "$GITHUB_SHA" ]; then
            echo "Main moved from $GITHUB_SHA to $current_main; skipping this gallery refresh."
            exit 1
          fi

      - name: Build screenshot image
        run: docker build --target e2e -t ats-fill:e2e .

      - name: Capture product screenshots
        run: |
          rm -rf screenshots
          mkdir -p screenshots
          docker run --rm \
            -v "${{ github.workspace }}/screenshots:/app/screenshots" \
            ats-fill:e2e \
            sh -c "xvfb-run --server-args='-screen 0 1280x720x24' npx playwright test --config config/playwright.config.mjs tests/e2e/screenshots.spec.mjs"

      - name: Validate screenshot gallery
        run: node scripts/validate-screenshot-gallery.mjs

      - name: Refresh README UI metadata
        run: node scripts/update-screenshot-metadata.mjs

      - name: Upload gallery artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ats-fill-ui-gallery-${{ github.run_id }}
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30

      - name: Publish gallery branch and PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if git diff --quiet -- screenshots README.md; then
            echo "UI gallery is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          expected_sha="$(git rev-parse HEAD)"
          branch="automation/ui-screenshot-gallery-${expected_sha:0:12}"

          git switch -c "$branch"
          git add screenshots/ README.md
          git commit -m "docs: refresh UI screenshots"
          git push --set-upstream origin "$branch"

          gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$branch" \
            --title "docs: refresh UI screenshots" \
            --body "Automated UI screenshot gallery refresh generated from main commit '$expected_sha'.

This PR is intentionally published through the repository PR workflow rather than pushing directly to main. The gallery was captured with the deterministic Playwright fixture and passed the screenshot gallery validator before publication."

          echo "Screenshot gallery PR created for $branch."
